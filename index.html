<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Padmavati Mess — Final</title>
<style>
:root{--bg:#f0f7f7;--card:rgba(255,255,255,.88);--ink:#46505e;--muted:#85919a;--line:rgba(170,196,198,.42);--blue:#6e9da7;--green:#5a9c91;--red:#c86d83;--purple:#8d7cad;--shadow:0 10px 30px rgba(103,130,147,.13)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 12% 16%,rgba(188,235,228,.72),transparent 43%),radial-gradient(ellipse at 88% 12%,rgba(255,218,216,.7),transparent 42%),radial-gradient(ellipse at 58% 94%,rgba(221,218,243,.5),transparent 46%),linear-gradient(130deg,#f1fbf8 0%,#f8f0f2 58%,#f3f4fa 100%);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background-color .25s ease,color .25s ease}
button,input,select{font:inherit}
button{cursor:pointer;border:0;transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,filter .2s ease,transform .2s ease}
.shell{display:flex;min-height:100vh}
.side{width:245px;background:linear-gradient(165deg,rgba(218,243,239,.96) 0%,rgba(235,233,246,.96) 55%,rgba(250,231,231,.97) 100%);border-right:1px solid rgba(255,255,255,.78);padding:25px 16px;flex-shrink:0;box-shadow:8px 0 32px rgba(119,147,157,.10);color:#515c69}
.brand{font-size:20px;font-weight:800;padding:4px 10px 24px;color:#475662;letter-spacing:.01em}
.brand small{display:block;color:#89959e;font-size:12px;font-weight:500;margin-top:3px}
.nav{display:grid;gap:5px}
.nav button{color:#687984;text-align:left;background:transparent;padding:11px 13px;border-radius:10px}
.nav button:hover{background:rgba(255,255,255,.58);color:#596f7a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.nav button.active{background:linear-gradient(110deg,rgba(169,224,217,.85),rgba(238,196,214,.88));color:#4c5968;font-weight:700;box-shadow:0 7px 18px rgba(126,147,168,.16),inset 0 0 0 1px rgba(255,255,255,.72)}
.main{flex:1;min-width:0;padding:28px clamp(18px,4vw,48px);max-width:1500px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}
.top h1{margin:0;font-size:26px;color:#46505e;letter-spacing:-.025em}
.top p{color:var(--muted);margin:5px 0 0}
.date{padding:10px;border:1px solid rgba(174,197,199,.55);border-radius:9px;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(240,249,248,.88));color:var(--ink);box-shadow:0 3px 10px rgba(106,137,149,.06)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:15px;margin-bottom:22px}
.card,.metric{background:var(--card);border:1px solid rgba(255,255,255,.82);border-radius:15px;box-shadow:var(--shadow);backdrop-filter:blur(14px);transition:box-shadow .22s ease,border-color .22s ease,transform .22s ease}
.card:hover,.metric:hover{box-shadow:0 15px 34px rgba(103,130,147,.17);border-color:rgba(255,255,255,.98)}
.metric{padding:18px 20px;position:relative;overflow:hidden}
.metric:after{content:"";position:absolute;right:-22px;top:-30px;width:86px;height:86px;border-radius:50%;background:currentColor;opacity:.075;pointer-events:none}
.metric:nth-child(4n+1){background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(221,246,242,.88));color:#57999a;border-color:rgba(196,231,225,.72)}
.metric:nth-child(4n+2){background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,231,232,.88));color:#c9788f;border-color:rgba(244,211,220,.78)}
.metric:nth-child(4n+3){background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,240,221,.9));color:#c3935f;border-color:rgba(244,226,199,.82)}
.metric:nth-child(4n+4){background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(235,229,248,.9));color:#8e80b0;border-color:rgba(224,216,242,.82)}
.metric span{color:var(--muted);font-size:13px}
.metric strong{display:block;font-size:26px;margin-top:7px;color:var(--ink)}
.content-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}
.card{padding:20px;margin-bottom:17px}
.card h2{font-size:17px;margin:0 0 15px;color:#515a68}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.field{padding:10px 12px;border:1px solid rgba(174,197,199,.58);border-radius:9px;background:rgba(255,255,255,.92);color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
.field:hover{border-color:#a7cfcb}
.field:focus,.date:focus{outline:3px solid rgba(118,179,178,.22);outline-offset:1px;border-color:#80b8b5;box-shadow:0 0 0 1px #80b8b5}
.toolbar .field{flex:1;min-width:150px}
.btn{padding:10px 14px;border-radius:9px;background:linear-gradient(145deg,#f6fbfa,#f4edf4);color:#637d86;font-weight:650;box-shadow:0 2px 6px rgba(106,137,149,.07)}
.btn:hover{filter:brightness(.985);box-shadow:0 6px 14px rgba(106,137,149,.16);transform:translateY(-1px)}
.btn:active{transform:translateY(0);filter:brightness(.96)}
.btn.primary{background:linear-gradient(115deg,#bd7294,#927eac);color:#fff;box-shadow:0 5px 13px rgba(159,111,149,.24)}
.btn.primary:hover{box-shadow:0 8px 20px rgba(159,111,149,.32)}
.btn.good{background:linear-gradient(145deg,#e1f5ef,#d9efed);color:#44877f}
.btn.danger{background:linear-gradient(145deg,#fff0ef,#fbe2e8);color:#b95c73}
.btn.small{padding:7px 10px;font-size:13px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid rgba(220,226,232,.72)}
th{color:#7c8c94;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:linear-gradient(90deg,rgba(232,247,245,.62),rgba(250,239,244,.64))}
td{font-size:14px}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:rgba(235,247,245,.55)}
.badge{display:inline-block;border-radius:20px;padding:4px 9px;background:#e0f3ed;color:#49887b;font-size:12px;font-weight:700}
.badge.off{background:#f1eef2;color:#7c7b86}
.meal-list{display:grid;gap:9px}
.meal-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(220,226,232,.72);padding:9px 0}
.checks{display:flex;gap:8px}
.check{border:1px solid rgba(174,197,199,.5);border-radius:8px;padding:6px 9px;color:var(--muted);background:rgba(255,255,255,.86);transition:background-color .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease}
.check:hover{border-color:#a7cfcb;background:#f4fbf9;box-shadow:0 3px 8px rgba(106,137,149,.08)}
.check.on{background:linear-gradient(145deg,#e0f3ed,#d9efed);border-color:#b6ddd5;color:#44877f}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px}
.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form label{font-size:13px;color:#71838c;display:grid;gap:5px}
.form .field{width:100%}
.notice{background:linear-gradient(110deg,#fff6e8,#fdf0e4);border:1px solid #f0dec6;color:#826b52;border-radius:10px;padding:12px;font-size:13px;margin:12px 0}
.progress{height:8px;background:#e8eeee;border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#8bcbc0,#d69ab2,#e8bd8e);border-radius:8px}
.pill{border-radius:20px;background:linear-gradient(120deg,#e6f5f2,#f4e8ef);color:#6f8186;padding:5px 9px;font-size:12px}
.section{display:none}
.section.active{display:block}
.toast{position:fixed;bottom:22px;right:22px;background:linear-gradient(115deg,#647d88,#88799b);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 12px 30px rgba(92,112,132,.25);z-index:4;animation:toast-in .24s ease-out}
.modal-bg{position:fixed;inset:0;background:rgba(69,84,100,.35);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;z-index:5;animation:veil-in .18s ease-out}
.modal{width:min(560px,100%);background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(250,246,250,.98));border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:22px;box-shadow:0 24px 75px rgba(80,103,120,.24);animation:modal-in .22s cubic-bezier(.2,.8,.25,1)}
.modal h2{margin:0 0 18px;color:#515a68}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chart{display:flex;align-items:end;gap:10px;height:130px;border-bottom:1px solid var(--line);padding:10px 4px}
.bar{flex:1;background:linear-gradient(180deg,#f2c9bb 0%,#d997b2 55%,#a897c4 100%);border-radius:6px 6px 0 0;min-height:4px;position:relative;transition:filter .2s ease,box-shadow .2s ease}
.bar:nth-child(3n+2){background:linear-gradient(180deg,#b9e5dd,#7fbdb8)}
.bar:nth-child(3n){background:linear-gradient(180deg,#f5dba7,#e5a98a)}
.bar:hover{filter:saturate(1.12) brightness(1.035);box-shadow:0 0 14px rgba(160,130,168,.25)}
.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
:focus-visible{outline:3px solid rgba(118,179,178,.42);outline-offset:2px}
::selection{background:#e4cfe2;color:#4d5361}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c8dcd9;border:2px solid transparent;border-radius:10px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#d5b9ca;border:2px solid transparent;background-clip:padding-box}
.auth-locked .shell,.auth-locked #modal-root,.auth-locked #toast-root{display:none!important}
.auth-screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 18% 20%,rgba(171,231,222,.8),transparent 42%),radial-gradient(ellipse at 82% 18%,rgba(255,203,212,.72),transparent 43%),radial-gradient(ellipse at 62% 88%,rgba(235,209,231,.66),transparent 43%),linear-gradient(135deg,#e7f6f3 0%,#f6eff4 54%,#f9eeee 100%)}
.auth-screen:before,.auth-screen:after{content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(1px);opacity:.55}
.auth-screen:before{width:250px;height:250px;left:-80px;top:12%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.76),rgba(197,235,229,.2) 68%,transparent 72%)}
.auth-screen:after{width:300px;height:300px;right:-96px;bottom:-105px;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.7),rgba(244,195,211,.2) 68%,transparent 72%)}
.auth-card{position:relative;width:min(430px,100%);padding:32px;border:1px solid rgba(255,255,255,.9);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.79),rgba(255,255,255,.63));box-shadow:0 26px 70px rgba(102,124,141,.2),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(22px);animation:modal-in .35s ease-out}
.auth-logo{width:58px;height:58px;display:grid;place-items:center;margin-bottom:20px;border-radius:19px;background:linear-gradient(140deg,#a8ded5,#d9b8d8 58%,#f2b7ad);box-shadow:0 10px 22px rgba(150,132,169,.2);font-size:27px}
.auth-eyebrow{margin:0 0 5px;color:#829298;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.12em}
.auth-card h1{margin:0;color:#4a5964;font-size:26px;letter-spacing:-.025em}
.auth-copy{margin:8px 0 22px;color:#829098;font-size:14px}
.auth-fields{display:grid;gap:13px}.country-phone-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:end;grid-column:1/-1}.country-phone-row label{min-width:0}.country-phone-row .field{min-width:0}.form .country-phone-row{grid-column:1/-1}
.auth-actions{display:grid;gap:9px;margin-top:4px}
.auth-actions .btn{width:100%}
.auth-links{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.auth-links button{padding:5px 8px;border:0;background:transparent;color:#71848d;font-size:13px}
.auth-links button:hover{color:#a95f83;text-decoration:underline}
#auth-code{letter-spacing:.34em;text-align:center;font-size:20px;font-weight:750}
.auth-fields label{display:grid;gap:6px;color:#687a82;font-size:13px;font-weight:600}
.auth-fields .field{width:100%;padding:12px 13px;border-color:rgba(168,194,194,.6);background:rgba(255,255,255,.78)}
.auth-submit{width:100%;margin-top:8px;padding:12px 16px}
.auth-error{min-height:18px;margin:0;color:#b35b73;font-size:13px}
.auth-fineprint{margin:18px 0 0;padding-top:15px;border-top:1px solid rgba(168,194,194,.3);color:#909aa0;font-size:11px;line-height:1.5;text-align:center}
.auth-note{margin:10px 0 0;color:#87949b;font-size:12px}
@keyframes veil-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.side{width:205px}.metrics{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}
@media(max-width:620px){.shell{display:block}.side{width:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.8);padding:12px}.brand{padding:2px 6px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px 14px}.top{align-items:flex-start}.top h1{font-size:22px}.metrics{gap:9px}.metric{padding:14px}.metric strong{font-size:22px}.form{grid-template-columns:1fr}.auth-screen{padding:16px}.auth-card{padding:26px 22px;border-radius:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body class="auth-locked"><div id="auth-screen" class="auth-screen"><form id="auth-form" class="auth-card" onsubmit="handleLocalLogin(event)" novalidate><div class="auth-logo" aria-hidden="true">🍽️</div><p class="auth-eyebrow">Padmavati Mess</p><h1 id="auth-title">Sign in</h1><p id="auth-copy" class="auth-copy"></p><div id="auth-fields" class="auth-fields"></div><p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p><div id="auth-actions" class="auth-actions"></div><div id="auth-links" class="auth-links"></div><p class="auth-fineprint">Your sign-in is saved in this browser. Phone recovery uses an SMS verification code. Mess records are stored separately.</p></form></div><div class="shell"><aside class="side"><div class="brand">🍽️ Padmavati Mess<small>Mess management</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="page-title">Dashboard</h1><p id="subtitle">A clear view of your mess operations.</p></div><input id="selected-date" class="date" type="date"></header><div id="page"></div></main></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
const pages=[['dashboard','▦','Dashboard'],['meals','✓','Meal attendance'],['members','♙','Members'],['billing','₹','Billing'],['expenses','↗','Expenses'],['reports','▤','Reports'],['history','◷','History & exports'],['settings','⚙','Settings']];
let state=JSON.parse(localStorage.getItem('padmavati-mess-html')||'{}');state.members||=[];state.meals||={};state.expenses||=[];state.rates||={Breakfast:30,Lunch:60,Dinner:60};state.advances||={};state.payments||=[];state.closures||={};state.closureAudit||=[];state.billSnapshots||={};state.planRates||={'Lunch Only':{monthly:1800,tiffin:60,included:['Lunch']},'Two Times':{monthly:3600,tiffin:56.66,included:['Lunch','Dinner']}};state.settings||={};let current='dashboard';const $=s=>document.querySelector(s),today=new Date().toISOString().slice(0,10);$('#selected-date').value=today;
$('#nav').innerHTML=pages.map(([id,icon,name])=>`<button data-page="${id}" class="${id===current?'active':''}">${icon}&nbsp; ${name}</button>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)showPage(b.dataset.page)};$('#selected-date').onchange=()=>render();
function save(){localStorage.setItem('padmavati-mess-html',JSON.stringify(state));render()}function cash(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('#toast-root').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',2400)}function showPage(p){current=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#page-title').textContent=pages.find(x=>x[0]===p)[2];$('#subtitle').textContent={dashboard:'A clear view of your mess operations.',meals:'Record daily meal attendance.',members:'Manage member profiles and meal plans.',billing:'Review meal charges and advance balances.',expenses:'Record day-to-day business expenses.',reports:'Summaries based on the records in this browser.',settings:'Adjust meal rates and manage your local data.'}[p];render()}
function mealsFor(date){return state.meals[date]||{}}function countMeal(date,type){return Object.values(mealsFor(date)).filter(x=>x.includes(type)).length}function totalBill(m,month){let start=month+'-01';return Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((n,[d,ids])=>n+(ids[m.id]||[]).reduce((a,t)=>a+(+state.rates[t]||0),0),0)}function metric(label,value){return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`}
function render(){let p=$('#page');if(current==='dashboard')p.innerHTML=dashboard();if(current==='meals')p.innerHTML=mealPage();if(current==='members')p.innerHTML=memberPage();if(current==='billing')p.innerHTML=billingPage();if(current==='expenses')p.innerHTML=expensePage();if(current==='reports')p.innerHTML=reportsPage();if(current==='history')p.innerHTML=historyPage();if(current==='settings')p.innerHTML=settingsPage()}
function dashboard(){let d=$('#selected-date').value||today,total=state.expenses.filter(e=>e.date.startsWith(d.slice(0,7))).reduce((a,e)=>a+ +e.amount,0);return `<div class="metrics">${metric('Active members',state.members.filter(m=>m.status!=='Inactive').length)}${metric('Breakfast today',countMeal(d,'Breakfast'))}${metric('Lunch today',countMeal(d,'Lunch'))}${metric('Dinner today',countMeal(d,'Dinner'))}</div><div class="content-grid"><section class="card"><h2>Today's attendance <span class="pill">${new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span></h2>${state.members.length?`<div class="table-wrap"><table><thead><tr><th>Member</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody>${state.members.map(m=>`<tr><td>${esc(m.name)}</td>${['Breakfast','Lunch','Dinner'].map(t=>`<td>${mealsFor(d)[m.id]?.includes(t)?'<span class="badge">Marked</span>':'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add members to begin tracking meals.</div>'}</section><section class="card"><h2>Monthly snapshot</h2><p class="muted">Expenses recorded this month</p><strong style="font-size:27px">${cash(total)}</strong><div style="margin-top:20px" class="row"><button class="btn primary" onclick="showPage('meals')">Mark meals</button><button class="btn" onclick="showPage('members')">Add a member</button></div></section></div>`}
function mealPage(){let d=$('#selected-date').value||today,ids=mealsFor(d);return `<section class="card"><div class="toolbar"><input id="meal-search" class="field" placeholder="Search members" oninput="filterMeals()"><button class="btn" onclick="markAll(true)">Select all</button><button class="btn" onclick="markAll(false)">Clear all</button></div><div id="meal-rows" class="meal-list">${state.members.filter(m=>m.status!=='Inactive').map(m=>`<div class="meal-row" data-name="${esc(m.name.toLowerCase())}"><strong>${esc(m.name)}</strong><div class="checks">${['Breakfast','Lunch','Dinner'].map(t=>`<button class="check ${ids[m.id]?.includes(t)?'on':''}" onclick="toggleMeal('${m.id}','${t}')">${t}</button>`).join('')}</div></div>`).join('')||'<div class="empty">No members yet. Add members first.</div>'}</div><p class="muted">Attendance is saved in this browser as you make changes.</p></section>`}
function filterMeals(){let q=$('#meal-search').value.toLowerCase();document.querySelectorAll('.meal-row').forEach(r=>r.classList.toggle('hidden',!r.dataset.name.includes(q)))}function toggleMeal(id,t){let d=$('#selected-date').value||today;if(state.closures[d.slice(0,7)])return toast('This billing month is locked. Reopen it first.');state.meals[d]||={};let a=state.meals[d][id]||[];state.meals[d][id]=a.includes(t)?a.filter(x=>x!==t):[...a,t];let m=state.members.find(x=>x.id===id);save();if(t==='Breakfast'&&!a.includes(t)&&m)sendBreakfastWhatsApp(m)}function markAll(on){let d=$('#selected-date').value||today;state.meals[d]||={};state.members.forEach(m=>state.meals[d][m.id]=on?['Breakfast','Lunch','Dinner']:[]);save()}
function memberPage(){return `<section class="card"><div class="toolbar"><input class="field" id="member-search" placeholder="Search members" oninput="filterMembers()"><button class="btn primary" onclick="memberModal()">＋ Add member</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Room</th><th>Meal plan</th><th>Status</th><th></th></tr></thead><tbody id="member-rows">${state.members.map((m,i)=>`<tr data-name="${esc(m.name.toLowerCase())}"><td><strong>${esc(m.name)}</strong></td><td>${esc(m.phone||'—')}</td><td>${esc(m.room||'—')}</td><td>${(m.plan||['Breakfast','Lunch','Dinner']).join(', ')}</td><td><span class="badge ${m.status==='Inactive'?'off':''}">${m.status||'Active'}</span></td><td><button class="btn small" onclick="memberModal(${i})">Edit</button> <button class="btn small danger" onclick="removeMember(${i})">Remove</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No members added yet.</td></tr>'}</tbody></table></div></section>`}function filterMembers(){let q=$('#member-search').value.toLowerCase();document.querySelectorAll('#member-rows tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.name?.includes(q)))}
function modal(title,body,submitText,fn){$('#modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modal-submit">${submitText}</button></div></div></div>`;$('#modal-submit').onclick=fn}function closeModal(){$('#modal-root').innerHTML=''}function memberModal(i){let m=state.members[i]||{};modal(i===undefined?'Add member':'Edit member',`<div class="form"><label>Full name<input class="field" id="m-name" value="${esc(m.name||'')}" required></label><label>Phone<input class="field" id="m-phone" value="${esc(m.phone||'')}"></label><label>Room number<input class="field" id="m-room" value="${esc(m.room||'')}"></label><label>Status<select class="field" id="m-status"><option ${m.status!=='Inactive'?'selected':''}>Active</option><option ${m.status==='Inactive'?'selected':''}>Inactive</option></select></label><label>Joining date<input class="field" id="m-join" type="date" value="${esc(m.join||today)}"></label><label>Leaving date<input class="field" id="m-leave" type="date" value="${esc(m.leave||'')}"></label><label>Parent mobile<input class="field" id="m-parent" value="${esc(m.parent||'')}"></label></div><p class="muted">Meal plan</p><div class="checks">${['Breakfast','Lunch','Dinner'].map(t=>`<label class="check"><input type="checkbox" class="plan" value="${t}" ${(m.plan||['Breakfast','Lunch','Dinner']).includes(t)?'checked':''}> ${t}</label>`).join('')}</div>`,i===undefined?'Add member':'Save changes',()=>{let name=$('#m-name').value.trim();if(!name)return toast('Enter a name.');if(state.members.some((x,j)=>j!==i&&x.name.toLowerCase()===name.toLowerCase()))return toast('A member with that name already exists.');let entry={...m,id:m.id||Date.now().toString(),name,phone:$('#m-phone').value.trim(),room:$('#m-room').value.trim(),status:$('#m-status').value,join:$('#m-join').value,leave:$('#m-leave').value,parent:$('#m-parent').value.trim(),plan:[...document.querySelectorAll('.plan:checked')].map(x=>x.value)};if(i===undefined)state.members.push(entry);else state.members[i]=entry;closeModal();save();toast('Member saved.')})}function removeMember(i){if(confirm(`Remove ${state.members[i].name} and their local meal history?`)){let id=state.members[i].id;state.members.splice(i,1);Object.values(state.meals).forEach(day=>delete day[id]);save()}}
function billingPage(){let month=($('#selected-date').value||today).slice(0,7),rows=state.members.map(m=>({m,b:totalBill(m,month),adv:+(state.advances[m.id]||0)}));return `<section class="card"><div class="toolbar"><input class="field" type="month" value="${month}" onchange="$('#selected-date').value=this.value+'-01';render()"><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="notice">Charges use the meal rates configured in Settings. Payments and advances can be recorded below.</div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Breakfast count</th><th>Lunch count</th><th>Dinner count</th><th>Meal charges</th><th>Advance</th><th>Balance</th><th></th></tr></thead><tbody>${rows.map(({m,b,adv})=>`<tr><td><strong>${esc(m.name)}</strong></td>${['Breakfast','Lunch','Dinner'].map(t=>`<td>${Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((n,[,a])=>n+(a[m.id]?.includes(t)?1:0),0)}</td>`).join('')}<td>${cash(b)}</td><td>${cash(adv)}</td><td><strong>${cash(b-adv)}</strong></td><td><button class="btn small" onclick="advanceModal('${m.id}')">Record advance</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No members to bill.</td></tr>'}</tbody></table></div></section>`}function advanceModal(id){let m=state.members.find(x=>x.id===id);modal(`Record advance · ${esc(m.name)}`,`<div class="form"><label>Amount (₹)<input class="field" id="adv-amount" type="number" min="0" step="0.01"></label><label>Date<input class="field" id="adv-date" type="date" value="${today}"></label><label>Payment mode<select class="field" id="adv-mode"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Other</option></select></label><label>Remarks<input class="field" id="adv-note"></label></div>`,'Save payment',()=>{let v=+$('#adv-amount').value;if(v<=0)return toast('Enter an amount greater than zero.');state.advances[id]=(+state.advances[id]||0)+v;closeModal();save();toast('Advance recorded.')})}
function expensePage(){return `<section class="card"><div class="toolbar"><input class="field" id="expense-month" type="month" value="${($('#selected-date').value||today).slice(0,7)}" onchange="render()"><button class="btn primary" onclick="expenseModal()">＋ Add expense</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Vendor</th><th>Mode</th><th>Amount</th><th></th></tr></thead><tbody>${state.expenses.filter(e=>!$('#expense-month')?.value||e.date.startsWith($('#expense-month').value)).map((e,i)=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.desc||'—')}</td><td>${esc(e.vendor||'—')}</td><td>${esc(e.mode)}</td><td>${cash(e.amount)}</td><td><button class="btn small danger" onclick="deleteExpense(${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No expenses for this month.</td></tr>'}</tbody></table></div></section>`}function expenseModal(){modal('Add expense',`<div class="form"><label>Date<input id="e-date" class="field" type="date" value="${today}"></label><label>Category<select id="e-cat" class="field"><option>Groceries</option><option>Utilities</option><option>Rent</option><option>Supplies</option><option>Transport</option><option>Other</option></select></label><label>Description<input id="e-desc" class="field"></label><label>Vendor<input id="e-vendor" class="field"></label><label>Amount (₹)<input id="e-amount" class="field" type="number" min="0" step="0.01"></label><label>Payment mode<select id="e-mode" class="field"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Other</option></select></label></div>`,'Save expense',()=>{let amount=+$('#e-amount').value;if(amount<=0)return toast('Enter an amount greater than zero.');state.expenses.push({date:$('#e-date').value,category:$('#e-cat').value,desc:$('#e-desc').value,vendor:$('#e-vendor').value,amount,mode:$('#e-mode').value});closeModal();save()})}function deleteExpense(i){if(confirm('Delete this expense?')){state.expenses.splice(i,1);save()}}
function reportsPage(){let month=($('#selected-date').value||today).slice(0,7),expenses=state.expenses.filter(e=>e.date.startsWith(month)).reduce((a,e)=>a+ +e.amount,0),billed=state.members.reduce((a,m)=>a+totalBill(m,month),0),mealCounts=['Breakfast','Lunch','Dinner'].map(t=>[t,Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((a,[,x])=>a+Object.values(x).filter(v=>v.includes(t)).length,0)]);let max=Math.max(1,...mealCounts.map(x=>x[1]));return `<section class="card"><div class="toolbar"><input class="field" type="month" value="${month}" onchange="$('#selected-date').value=this.value+'-01';render()"></div><div class="metrics">${metric('Meal charges',cash(billed))}${metric('Expenses',cash(expenses))}${metric('Active members',state.members.filter(m=>m.status!=='Inactive').length)}${metric('Net before other costs',cash(billed-expenses))}</div><div class="content-grid"><section class="card"><h2>Meals served</h2><div class="chart">${mealCounts.map(([n,v])=>`<div class="bar" style="height:${Math.max(4,v/max*100)}%" title="${v}"><span>${n}</span></div>`).join('')}</div></section><section class="card"><h2>Expense summary</h2>${[...new Set(state.expenses.filter(e=>e.date.startsWith(month)).map(e=>e.category))].map(c=>`<div class="meal-row"><span>${esc(c)}</span><strong>${cash(state.expenses.filter(e=>e.date.startsWith(month)&&e.category===c).reduce((a,e)=>a+ +e.amount,0))}</strong></div>`).join('')||'<p class="muted">No expense data for this month.</p>'}</section></div></section>`}
function settingsPage(){return `<section class="card"><h2>Meal rates</h2><p class="muted">Rates apply to billing calculations in this browser.</p><div class="form">${['Breakfast','Lunch','Dinner'].map(t=>`<label>${t} rate (₹)<input class="field" type="number" min="0" step="0.01" id="rate-${t}" value="${+state.rates[t]||0}"></label>`).join('')}</div><button class="btn primary" style="margin-top:15px" onclick="saveRates()">Save rates</button></section><section class="card"><h2>Local data</h2><p>Records are stored in this browser's local storage on this device.</p><div class="row"><button class="btn" onclick="exportBackup()">Download data backup</button><label class="btn" style="text-align:center">Import backup<input type="file" accept="application/json" hidden onchange="importBackup(event)"></label><button class="btn danger" onclick="clearData()">Clear all data</button></div><div class="notice">This standalone HTML file does not connect to the SQLite database or backend from the Python app. WhatsApp delivery, PDF generation, and Excel export need a server or separate integrations.</div></section>`}function saveRates(){['Breakfast','Lunch','Dinner'].forEach(t=>state.rates[t]=+$('#rate-'+t).value||0);save();toast('Rates saved.')}function exportBackup(){download(JSON.stringify(state,null,2),'padmavati-mess-backup.json','application/json')}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.members))throw Error();state=x;save();toast('Backup imported.')}catch{toast('That backup file could not be read.')}};r.readAsText(f)}function clearData(){if(confirm('Clear all members, meal history, expenses, and settings from this browser?')){localStorage.removeItem('padmavati-mess-html');location.reload()}}function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportCSV(){let month=($('#selected-date').value||today).slice(0,7),lines=[['Member','Breakfast','Lunch','Dinner','Meal charges','Advance','Balance'].join(',')];state.members.forEach(m=>{let n=t=>Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((a,[,x])=>a+(x[m.id]?.includes(t)?1:0),0),b=totalBill(m,month),ad=+state.advances[m.id]||0;lines.push([m.name,n('Breakfast'),n('Lunch'),n('Dinner'),b,ad,b-ad].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))});download(lines.join('\n'),'padmavati-billing-'+month+'.csv','text/csv')}
// Extended features mirrored from the Kivy application.
function activePlan(m){let p=(m.plan||[]).map(x=>x.toLowerCase());if(p.length===1&&p[0]==='lunch')return 'Lunch Only';if(p.includes('lunch')&&p.includes('dinner'))return 'Two Times';return 'Custom'}
function planInfo(m){let p=activePlan(m),x=state.planRates[p];return x?{name:p,...x}:null}
function mealAmount(m,month){let p=planInfo(m),include=p?.included||['Breakfast','Lunch','Dinner'];return Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((n,[,rows])=>n+(rows[m.id]||[]).reduce((a,t)=>a+(include.includes(t)?(p?+p.tiffin:+state.rates[t]||0):0),0),0)}
function paymentsTotal(id,month){return state.payments.filter(x=>x.member===id&&(!month||x.date.startsWith(month))).reduce((a,x)=>a+ +x.amount,0)}
function historicalPayments(id,month){return paymentsTotal(id,month)}
function memberBalance(m,month){let opening=+state.advances[m.id]||0;let prior=state.payments.filter(x=>x.member===m.id&&x.date.slice(0,7)<month).reduce((a,x)=>a+ +x.amount,0);let spent=Object.entries(state.meals).filter(([d])=>d.slice(0,7)<month).reduce((a,[d,rows])=>a+((rows[m.id]||[]).reduce((n,t)=>n+(+state.rates[t]||0),0)),0);return opening+prior-spent}
function billCalc(m,month){let value=mealAmount(m,month),payments=paymentsTotal(m.id,month),opening=memberBalance(m,month),balanceAfter=opening+payments-value,target=planInfo(m)?.monthly||0,due=planInfo(m)?Math.max(0,target-balanceAfter):Math.max(0,-balanceAfter),closing=Math.max(0,balanceAfter);return {value,payments,opening,due,closing,paid:Math.min(value,Math.max(0,opening+payments)),balanceAfter,target}}
function historyPage(){return `<section class="card"><div class="toolbar"><select id="hist-member" class="field"><option value="">All members</option>${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input id="hist-from" class="field" type="date" value="${new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10)}"><input id="hist-to" class="field" type="date" value="${today}"><select id="hist-type" class="field"><option value="all">All records</option><option value="meals">Meals</option><option value="payments">Payments</option></select><button class="btn primary" onclick="renderHistory()">Filter / view</button><button class="btn" onclick="exportHistory()">Export filtered CSV</button><button class="btn" onclick="showPage('members')">Member list</button></div><div id="history-result"></div></section><section class="card"><h2>Consolidated history</h2><p class="muted">Filter meal records and payments for all members or a selected member, then export the result.</p></section>`}
function renderHistory(){let el=$('#history-result');if(!el)return;let id=$('#hist-member').value,from=$('#hist-from').value,to=$('#hist-to').value,type=$('#hist-type').value,rows=[];if(type!=='payments')Object.entries(state.meals).forEach(([date,ms])=>{if(date<from||date>to)return;Object.entries(ms).forEach(([mid,ts])=>{let m=state.members.find(x=>x.id===mid);if(m&&(!id||id===mid))ts.forEach(t=>rows.push({date,member:m.name,type:'Meal · '+t,amount:cash(state.rates[t])}))})});if(type!=='meals')state.payments.forEach(x=>{let m=state.members.find(y=>y.id===x.member);if(m&&x.date>=from&&x.date<=to&&(!id||id===x.member))rows.push({date:x.date,member:m.name,type:'Advance payment · '+(x.mode||'Cash'),amount:cash(x.amount),note:x.note||''})});rows.sort((a,b)=>a.date.localeCompare(b.date));el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Member</th><th>Record</th><th>Amount</th><th>Remarks</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.member)}</td><td>${esc(x.type)}</td><td>${x.amount}</td><td>${esc(x.note||'')}</td></tr>`).join('')||'<tr><td class="empty" colspan="5">No records in this date range.</td></tr>'}</tbody></table></div>`}
function exportHistory(){renderHistory();let id=$('#hist-member').value,from=$('#hist-from').value,to=$('#hist-to').value;let rows=[['Date','Member','Type','Amount','Remarks']];Object.entries(state.meals).forEach(([d,ms])=>{if(d<from||d>to)return;Object.entries(ms).forEach(([mid,ts])=>{let m=state.members.find(x=>x.id===mid);if(m&&(!id||id===mid))ts.forEach(t=>rows.push([d,m.name,'Meal '+t,state.rates[t]||0,'']))})});state.payments.forEach(x=>{let m=state.members.find(y=>y.id===x.member);if(m&&x.date>=from&&x.date<=to&&(!id||id===x.member))rows.push([x.date,m.name,'Advance '+x.mode,x.amount,x.note||''])});download(rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'padmavati-history.csv','text/csv')}
function postBill(m,month){let c=billCalc(m,month),p=planInfo(m),days=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate(),start=month+'-01',end=month+'-'+String(days).padStart(2,'0');return {m,c,p,start,end}}
function printBill(m,month){let {c,p,start,end}=postBill(m,month),counts=['Breakfast','Lunch','Dinner'].map(t=>[t,Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((a,[,v])=>a+(v[m.id]?.includes(t)?1:0),0)]),w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print the bill.');w.document.write(`<html><head><title>Bill ${esc(m.name)}</title><style>body{font:15px Arial;padding:35px;color:#202a3b}h1{color:#326bd1}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{border:1px solid #ddd;padding:10px;text-align:left}.total{font-size:22px;font-weight:bold}</style></head><body><h1>Padmavati Mess</h1><h2>Monthly Bill</h2><p>Member: ${esc(m.name)} · Room: ${esc(m.room||'—')}</p><p>Period: ${start} to ${end} · Plan: ${esc(p?.name||'Meal rates')}</p><table><tr><th>Meal</th><th>Count</th><th>Rate</th></tr>${counts.map(([t,n])=>`<tr><td>${t}</td><td>${n}</td><td>${cash(p?.included.includes(t)?p.tiffin:state.rates[t])}</td></tr>`).join('')}<tr><td colspan="2">Meal value</td><td>${cash(c.value)}</td></tr><tr><td colspan="2">Payments / advance applied</td><td>${cash(c.paid)}</td></tr></table><p>Opening advance: ${cash(c.opening)} · Payments this month: ${cash(c.payments)}</p><p class="total">Amount due: ${cash(c.due)} · Closing advance: ${cash(c.closing)}</p><button onclick="print()">Print / Save as PDF</button></body></html>`);w.document.close()}
function billingPage(){let month=($('#selected-date').value||today).slice(0,7),rows=state.members.map(m=>({m,c:billCalc(m,month),p:planInfo(m)}));let closed=!!state.closures[month];return `<section class="card"><div class="toolbar"><input class="field" type="month" value="${month}" onchange="$('#selected-date').value=this.value+'-01';render()"><span class="pill">${closed?'CLOSED & LOCKED':'OPEN'}</span><button class="btn" onclick="toggleCloseMonth('${month}')">${closed?'Reopen month':'Close & lock month'}</button><button class="btn" onclick="exportCSV()">Export bills CSV</button></div><div class="notice">Plan: Lunch Only uses ₹1,800 monthly target and ₹60/tiffin; Two Times uses ₹3,600 and ₹56.66/tiffin. Custom meal plans use meal rates from Settings. Closing saves bill snapshots and locks meal/payment edits. Reopening requires a reason.</div><div class="table-wrap"><table><thead><tr><th>Member / plan</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th><th>Meal value</th><th>Payments</th><th>Amount due</th><th>Closing advance</th><th>Actions</th></tr></thead><tbody>${rows.map(({m,c,p})=>`<tr><td><strong>${esc(m.name)}</strong><br><span class="muted">${esc(p?.name||'Custom')}</span></td>${['Breakfast','Lunch','Dinner'].map(t=>`<td>${Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((n,[,a])=>n+(a[m.id]?.includes(t)?1:0),0)}</td>`).join('')}<td>${cash(c.value)}</td><td>${cash(c.payments)}</td><td><strong>${cash(c.due)}</strong></td><td>${cash(c.closing)}</td><td><button class="btn small" onclick="advanceModal('${m.id}')">Payment</button> <button class="btn small" onclick="paymentHistory('${m.id}','${month}')">Manage</button> <button class="btn small" onclick="printBill(state.members.find(x=>x.id==='${m.id}'),'${month}')">Bill PDF</button> <button class="btn small" onclick="advanceLedger('${m.id}','${month}')">Ledger</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No members to bill.</td></tr>'}</tbody></table></div><div style="margin-top:16px"><button class="btn primary" onclick="printAllBills('${month}')">Print all active bills</button> <button class="btn good" onclick="sendBillsWhatsApp('${month}')">Send bills / reminders on WhatsApp</button> <button class="btn" onclick="saveBillSnapshots('${month}')">Generate / save bill snapshots</button></div></section><section class="card"><h2>Plan rates</h2><div class="form">${['Lunch Only','Two Times'].map(k=>`<fieldset><legend>${k}</legend><label>Monthly advance target<input class="field" type="number" id="plan-month-${k}" value="${state.planRates[k].monthly}"></label><label>Tiffin rate<input class="field" type="number" step="0.01" id="plan-rate-${k}" value="${state.planRates[k].tiffin}"></label></fieldset>`).join('')}</div><button class="btn" onclick="savePlanRates()">Save plan rates</button></section>`}
function toggleCloseMonth(month){if(state.closures[month]){let reason=prompt('Enter a reason to reopen this month:');if(!reason?.trim())return toast('A reason is required.');delete state.closures[month];state.closureAudit.push({month,action:'REOPENED',date:new Date().toISOString(),reason});toast('Month reopened.')}else{if(!confirm('Close and lock this month for all active members? Bill snapshots will be saved.'))return;saveBillSnapshots(month);state.closures[month]={date:new Date().toISOString(),scope:'all'};state.closureAudit.push({month,action:'CLOSED',date:new Date().toISOString(),reason:'All active members'});toast('Month closed and locked.')}save()}
function saveBillSnapshots(month){state.billSnapshots[month]={};state.members.filter(m=>m.status!=='Inactive').forEach(m=>state.billSnapshots[month][m.id]={...billCalc(m,month),member:m.name,plan:activePlan(m),generated:new Date().toISOString()});save();toast('Bill snapshots saved.')}
function savePlanRates(){for(let k of ['Lunch Only','Two Times']){state.planRates[k].monthly=+$('#plan-month-'+k).value||0;state.planRates[k].tiffin=+$('#plan-rate-'+k).value||0}save();toast('Plan rates saved.')}
function advanceModal(id){let m=state.members.find(x=>x.id===id);modal(`Record advance · ${esc(m.name)}`,`<div class="form"><label>Amount (₹)<input class="field" id="adv-amount" type="number" min="0" step="0.01"></label><label>Date<input class="field" id="adv-date" type="date" value="${today}"></label><label>Payment mode<select class="field" id="adv-mode"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Other</option></select></label><label>Remarks<input class="field" id="adv-note"></label></div>`,'Save payment',()=>{let v=+$('#adv-amount').value,d=$('#adv-date').value;if(v<=0)return toast('Enter an amount greater than zero.');if(state.closures[d.slice(0,7)])return toast('This billing month is locked. Reopen it first.');state.payments.push({id:Date.now().toString(),member:id,date:d,amount:v,mode:$('#adv-mode').value,note:$('#adv-note').value});closeModal();save();toast('Advance recorded.')})}
function paymentHistory(id,month){let m=state.members.find(x=>x.id===id),items=state.payments.filter(x=>x.member===id&&x.date.startsWith(month));modal(`Payments · ${esc(m.name)} · ${month}`,`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Remarks</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.date}</td><td>${cash(x.amount)}</td><td>${esc(x.mode)}</td><td>${esc(x.note)}</td><td><button class="btn small danger" onclick="removePayment('${x.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No payments recorded for this month.</td></tr>'}</tbody></table></div>`,'Close',closeModal)}function removePayment(pid){let x=state.payments.find(p=>p.id===pid);if(!x)return;if(state.closures[x.date.slice(0,7)])return toast('Month is locked; reopen it first.');let reason=prompt('Reason for removing this payment:');if(reason===null)return;state.closureAudit.push({action:'PAYMENT REMOVED',payment:{...x},date:new Date().toISOString(),reason:reason||'No reason entered'});state.payments=state.payments.filter(p=>p.id!==pid);closeModal();save();toast('Payment removed and added to audit.')}
function advanceLedger(id,month){let m=state.members.find(x=>x.id===id),rows=Object.keys(state.meals).filter(d=>d.slice(0,7)<=month).map(d=>d.slice(0,7)).filter((x,i,a)=>a.indexOf(x)===i).sort();let html=`<h2>Advance Ledger · ${esc(m.name)}</h2><p class="muted">Monthly balance = opening balance + payments received − tiffin proceeds.</p><table><thead><tr><th>Month</th><th>Opening</th><th>Payments</th><th>Tiffin value</th><th>Closing</th><th>Receivable to target</th></tr></thead><tbody>${rows.map(mon=>{let c=billCalc(m,mon),target=planInfo(m)?.monthly||0;return `<tr><td>${mon}</td><td>${cash(c.opening)}</td><td>${cash(c.payments)}</td><td>${cash(c.value)}</td><td>${cash(c.closing)}</td><td>${cash(Math.max(0,target-c.closing))}</td></tr>`}).join('')||'<tr><td colspan="6">No billable records.</td></tr>'}</tbody></table><h3>Removed payment audit</h3>${state.closureAudit.filter(x=>x.payment?.member===id).slice(-50).map(x=>`<p>${cash(x.payment.amount)} removed · ${esc(x.payment.date)} · ${esc(x.reason)}</p>`).join('')||'<p class="muted">No removed payment entries.</p>'}`;modal('Advance ledger',html,'Export ledger',()=>{let data=[['Month','Opening','Payments','Tiffin','Closing','Receivable']];rows.forEach(mon=>{let c=billCalc(m,mon);data.push([mon,c.opening,c.payments,c.value,c.closing,Math.max(0,(planInfo(m)?.monthly||0)-c.closing)])});download(data.map(x=>x.join(',')).join('\n'),'advance-ledger-'+m.name+'.csv','text/csv')})}
function memberPage(){return `<section class="card"><div class="toolbar"><input class="field" id="member-search" placeholder="Search members" oninput="filterMembers()"><button class="btn primary" onclick="memberModal()">＋ Add member</button><button class="btn" onclick="exportMemberCSV()">Export member list</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Room</th><th>Meal plan</th><th>Status</th><th>Joining date</th><th></th></tr></thead><tbody id="member-rows">${state.members.map((m,i)=>`<tr data-name="${esc(m.name.toLowerCase())}"><td><button class="btn small" onclick="showProfile('${m.id}')">${esc(m.name)}</button></td><td>${esc(m.phone||'—')}</td><td>${esc(m.room||'—')}</td><td>${(m.plan||[]).join(', ')}</td><td><span class="badge ${m.status==='Inactive'?'off':''}">${m.status||'Active'}</span></td><td>${m.join||'—'}</td><td><button class="btn small" onclick="memberModal(${i})">Edit</button> <button class="btn small" onclick="showMemberHistory('${m.id}')">History</button> <button class="btn small danger" onclick="removeMember(${i})">Remove</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No members added yet.</td></tr>'}</tbody></table></div></section>`}
function exportMemberCSV(){let rows=[['Name','Phone','Room','Meal Plan','Status','Joining Date','Leaving Date','Parent Mobile']];state.members.forEach(m=>rows.push([m.name,m.phone,m.room,(m.plan||[]).join('|'),m.status,m.join,m.leave,m.parent]));download(rows.map(r=>r.map(x=>'"'+String(x||'').replaceAll('"','""')+'"').join(',')).join('\n'),'padmavati-members.csv','text/csv')}
function showProfile(id){let m=state.members.find(x=>x.id===id);modal('Member profile',`<p><b>${esc(m.name)}</b> · ${esc(m.status||'Active')}</p><p>Phone: ${esc(m.phone||'—')} · Parent: ${esc(m.parent||'—')} · Room: ${esc(m.room||'—')}</p><p>Joined: ${m.join||'—'} · Leaving: ${m.leave||'—'} · Plan: ${(m.plan||[]).join(', ')||'None'}</p><p>Payments to date: ${cash(paymentsTotal(id,''))}</p>`,'View history',()=>{closeModal();showMemberHistory(id)})}

function exportCSV(){let month=($('#selected-date').value||today).slice(0,7),lines=[['Member','Plan','Breakfast','Lunch','Dinner','Tiffin Value','Payments','Due','Closing Advance'].join(',')];state.members.forEach(m=>{let n=t=>Object.entries(state.meals).filter(([d])=>d.startsWith(month)).reduce((a,[,x])=>a+(x[m.id]?.includes(t)?1:0),0),c=billCalc(m,month);lines.push([m.name,activePlan(m),n('Breakfast'),n('Lunch'),n('Dinner'),c.value,c.payments,c.due,c.closing].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))});download(lines.join('\n'),'padmavati-billing-'+month+'.csv','text/csv')}
function expensePage(){let month=$('#selected-date').value?.slice(0,7)||today.slice(0,7);return `<section class="card"><div class="toolbar"><label>From <input class="field" id="expense-from" type="date" value="${month}-01"></label><label>To <input class="field" id="expense-to" type="date" value="${today}"></label><button class="btn" onclick="render()">Filter</button><button class="btn primary" onclick="expenseModal()">＋ Add expense</button><button class="btn" onclick="exportExpenses()">Export expenses CSV</button><button class="btn" onclick="groupPnl()">Group-wise P&L</button></div><div id="expense-rows"></div></section>`}
function renderExpenses(){let el=$('#expense-rows');if(!el)return;let a=$('#expense-from')?.value||'0000',b=$('#expense-to')?.value||'9999',rows=state.expenses.map((e,i)=>({...e,i})).filter(e=>e.date>=a&&e.date<=b);el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Vendor</th><th>Payment mode</th><th>Amount</th><th>Notes</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.desc||'')}</td><td>${esc(e.vendor||'')}</td><td>${esc(e.mode||'')}</td><td>${cash(e.amount)}</td><td>${esc(e.notes||'')}</td><td><button class="btn small" onclick="expenseModal(${e.i})">Edit</button> <button class="btn small danger" onclick="deleteExpense(${e.i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No expenses in this date range.</td></tr>'}</tbody></table></div>`}
function expenseModal(i){let e=state.expenses[i]||{};modal(i===undefined?'Add expense':'Edit expense',`<div class="form"><label>Date<input id="e-date" class="field" type="date" value="${e.date||today}"></label><label>Category<select id="e-cat" class="field">${['Groceries','Utilities','Rent','Supplies','Transport','Staff','EMI','Other'].map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Description<input id="e-desc" class="field" value="${esc(e.desc||'')}"></label><label>Vendor / shop<input id="e-vendor" class="field" value="${esc(e.vendor||'')}"></label><label>Amount (₹)<input id="e-amount" class="field" type="number" min="0" step="0.01" value="${e.amount||''}"></label><label>Payment mode<select id="e-mode" class="field">${['Cash','UPI','Bank transfer','Card','Other'].map(x=>`<option ${e.mode===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Notes<input id="e-notes" class="field" value="${esc(e.notes||'')}"></label></div>`,'Save expense',()=>{let amount=+$('#e-amount').value;if(amount<=0)return toast('Enter an amount greater than zero.');let x={date:$('#e-date').value,category:$('#e-cat').value,desc:$('#e-desc').value,vendor:$('#e-vendor').value,amount,mode:$('#e-mode').value,notes:$('#e-notes').value};if(i===undefined)state.expenses.push(x);else state.expenses[i]=x;closeModal();save()})}
function exportExpenses(){let rows=[['Date','Category','Description','Vendor','Amount','Mode','Notes'],...state.expenses.map(e=>[e.date,e.category,e.desc,e.vendor,e.amount,e.mode,e.notes])];download(rows.map(r=>r.map(x=>'"'+String(x||'').replaceAll('"','""')+'"').join(',')).join('\n'),'padmavati-expenses.csv','text/csv')}
function groupPnl(){let from=$('#expense-from')?.value||'0000',to=$('#expense-to')?.value||'9999',monthly=new Set(Object.keys(state.meals).filter(d=>d>=from&&d<=to).map(d=>d.slice(0,7))),income=state.members.reduce((a,m)=>a+[...monthly].reduce((n,mon)=>n+mealAmount(m,mon),0),0),groups=[...new Set(state.expenses.filter(e=>e.date>=from&&e.date<=to).map(e=>e.category))],sum=groups.reduce((a,g)=>a+state.expenses.filter(e=>e.category===g&&e.date>=from&&e.date<=to).reduce((n,e)=>n+ +e.amount,0),0);modal('Group-wise profit & loss',`<p><b>Billed income:</b> ${cash(income)} · <b>Expenses:</b> ${cash(sum)} · <b>Net profit / loss:</b> ${cash(income-sum)}</p><p><b>Payments actually received:</b> ${cash(state.payments.filter(p=>p.date>=from&&p.date<=to).reduce((a,p)=>a+ +p.amount,0))}</p><table><thead><tr><th>Expense group</th><th>Entries</th><th>Total</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g)}</td><td>${state.expenses.filter(e=>e.category===g&&e.date>=from&&e.date<=to).length}</td><td>${cash(state.expenses.filter(e=>e.category===g&&e.date>=from&&e.date<=to).reduce((a,e)=>a+ +e.amount,0))}</td></tr>`).join('')}</tbody></table><button class="btn" onclick="alert('Net profit excluding EMI: '+ '${cash(income-state.expenses.filter(e=>e.date>= '${from}' &&e.date<= '${to}' &&e.category!=='EMI').reduce((a,e)=>a+ +e.amount,0))}')">Show profit if EMI was not there</button>`,'Close',closeModal)}
function settingsPage(){return `<section class="card"><h2>Meal rates (effective for custom meal plans)</h2><p class="muted">Rates apply to custom meal plans and history calculations.</p><div class="form">${['Breakfast','Lunch','Dinner'].map(t=>`<label>${t} rate (₹)<input class="field" type="number" min="0" step="0.01" id="rate-${t}" value="${+state.rates[t]||0}"></label>`).join('')}</div><button class="btn primary" style="margin-top:15px" onclick="saveRates()">Save rates</button></section><section class="card"><h2>WhatsApp</h2><div class="form"><label><input id="wa-enabled" type="checkbox" ${state.settings.waEnabled?'checked':''}> Enable breakfast WhatsApp notifications</label><label>Sender / business number<input class="field" id="wa-number" value="${esc(state.settings.waNumber||'')}"></label><label>Secure backend URL<input class="field" id="wa-url" placeholder="https://your-domain.com" value="${esc(state.settings.waUrl||'')}"></label><label>Backend API key<input class="field" id="wa-key" type="password" value="${esc(state.settings.waKey||'')}"></label></div><div class="notice">Keep Meta credentials on your server. Browser-only HTML cannot safely store a Meta access token. Configure the same secure backend used by the Python app to enable bill and reminder delivery.</div><button class="btn primary" onclick="saveWhatsApp()">Save WhatsApp settings</button> <button class="btn" onclick="testWhatsApp()">Test click-to-chat</button></section><section class="card"><h2>Local data · backup & restore</h2><p>Member, meal, bill, payment, expense, settings, and audit data are saved in this browser.</p><div class="row"><button class="btn" onclick="exportBackup()">Create JSON backup</button><label class="btn" style="text-align:center">Restore JSON backup<input type="file" accept="application/json,.json" hidden onchange="importBackup(event)"></label><button class="btn" onclick="document.getElementById('db-file').click()">Import CSV data</button><input id="db-file" type="file" accept=".csv,.json,.db,.sqlite" hidden onchange="importDataFile(event)"><button class="btn danger" onclick="clearData()">Clear all data</button></div><div class="notice">SQLite .db backups are not readable directly in a browser. Export data as CSV or use a JSON backup from this HTML version. Original app database folder configuration is replaced by browser storage.</div></section><section class="card"><h2>Financial report</h2><p>Summary and details are available under Reports; use History & exports for filtered member, meal, and payment records.</p></section>`}

function sendBreakfastWhatsApp(m){if(!state.settings.waEnabled)return;let n=normalPhone(m.parent||m.phone);if(n)window.open('https://wa.me/'+n+'?text='+encodeURIComponent(`Hello, breakfast has been marked for ${m.name} at Padmavati Mess for ${$('#selected-date').value}. Thank you.`),'_blank')}
function importDataFile(e){let f=e.target.files[0];if(!f)return;if(f.name.toLowerCase().endsWith('.db')||f.name.toLowerCase().endsWith('.sqlite'))return toast('SQLite database import is not available in standalone browser HTML.');let r=new FileReader();r.onload=()=>{try{if(f.name.toLowerCase().endsWith('.json')){let x=JSON.parse(r.result);if(!Array.isArray(x.members))throw Error();state=x;save();return}let lines=r.result.split(/\r?\n/).filter(Boolean).map(x=>x.split(','));let head=lines.shift().map(x=>x.trim().replace(/^"|"$/g,''));let added=0;lines.forEach(line=>{let row={};head.forEach((h,i)=>row[h.toLowerCase().trim()]=String(line[i]||'').replace(/^"|"$/g,''));let name=row.name||row.member;if(name&&!state.members.some(m=>m.name.toLowerCase()===name.toLowerCase())){state.members.push({id:Date.now().toString()+added,name,phone:row.phone||'',room:row.room||row.room_no||'',status:row.status||'Active',join:row.joining_date||'',parent:row.parent_mobile||'',plan:(row.meal_plan||'Breakfast,Lunch,Dinner').split(/[|,]/)});added++}});save();toast(`Imported ${added} member rows.`)}catch{toast('Unable to read this file. Use a CSV with a Name column or a JSON backup.')}};r.readAsText(f)}

async function sendBillsWhatsApp(month){let members=state.members.filter(m=>m.status!=='Inactive'&&(m.parent||m.phone));if(!members.length)return toast('Add member or parent phone numbers first.');for(let m of members){let n=normalPhone(m.parent||m.phone),c=billCalc(m,month);if(!n)continue;let msg=`Hello ${m.name}, your Padmavati Mess bill for ${month} is ${cash(c.due)} due. Meal value ${cash(c.value)}, payments/advance ${cash(c.paid)}. Please contact us if you have any questions.`;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')}if(state.settings.waUrl)toast('WhatsApp chats opened. Backend bill PDF delivery requires an endpoint configured for the Python app payload.')}

function dashboard(){let d=$('#selected-date').value||today,month=d.slice(0,7),active=state.members.filter(m=>m.status!=='Inactive'),expected=0,marked=0;for(const m of active){let plan=(m.plan&&m.plan.length?m.plan:['Breakfast','Lunch','Dinner']);expected+=plan.length;marked+=(mealsFor(d)[m.id]||[]).filter(t=>plan.includes(t)).length}let pending=Math.max(0,expected-marked),monthIncome=active.reduce((n,m)=>n+mealAmount(m,month),0),monthExpenses=state.expenses.filter(e=>e.date.startsWith(month)).reduce((n,e)=>n+(+e.amount||0),0),pendingRows=active.map(m=>{let plan=(m.plan&&m.plan.length?m.plan:['Breakfast','Lunch','Dinner']),done=(mealsFor(d)[m.id]||[]).filter(t=>plan.includes(t)).length;return {m,plan,done,left:Math.max(0,plan.length-done)}}).filter(x=>x.left);return `<div class="metrics"><button class="metric" onclick="showPage('members')"><span>Total members</span><strong>${state.members.length}</strong><small class="muted">${active.length} active</small></button><button class="metric" onclick="showPage('meals')"><span>Meals marked · ${d}</span><strong>${marked}</strong><small class="muted">Today’s attendance</small></button><button class="metric" onclick="showPendingReview()"><span>Pending review</span><strong>${pending}</strong><small class="muted">Meal slots still unmarked</small></button><button class="metric" onclick="showPage('meals')"><span>Expected meals</span><strong>${expected}</strong><small class="muted">From active member plans</small></button></div><div class="toolbar"><button class="btn primary" onclick="showPage('meals')">Mark attendance</button><button class="btn" onclick="memberModal()">＋ Add member</button><button class="btn" onclick="showPage('billing')">Open billing</button><button class="btn" onclick="showPage('expenses')">Record expense</button><button class="btn" onclick="showPage('reports')">Financial reports</button></div><div class="content-grid"><section class="card"><h2>Attendance overview <span class="pill">${d}</span></h2><div class="row"><div><strong>${marked} / ${expected}</strong><p class="muted">meal slots recorded</p><div class="progress"><i style="width:${expected?Math.min(100,marked/expected*100):0}%"></i></div></div><div><strong>${pending}</strong><p class="muted">meal slots pending</p><button class="btn small" onclick="showPendingReview()">Review pending members</button></div></div>${pendingRows.length?`<div class="meal-list" style="margin-top:14px">${pendingRows.slice(0,5).map(x=>`<div class="meal-row"><span><strong>${esc(x.m.name)}</strong><small class="muted"> · ${x.left} pending</small></span><button class="btn small" onclick="showPage('meals')">Open attendance</button></div>`).join('')}${pendingRows.length>5?`<p class="muted">and ${pendingRows.length-5} more members</p>`:''}</div>`:'<p class="muted">All planned meals are marked for this date.</p>'}</section><section class="card"><h2>Financial snapshot · ${month}</h2><div class="meal-row"><span>Estimated meal charges</span><strong>${cash(monthIncome)}</strong></div><div class="meal-row"><span>Recorded expenses</span><strong>${cash(monthExpenses)}</strong></div><div class="meal-row"><span>Net before other costs</span><strong>${cash(monthIncome-monthExpenses)}</strong></div><div class="row" style="margin-top:14px"><button class="btn small" onclick="showPage('billing')">Billing details</button><button class="btn small" onclick="groupPnl()">Profit & loss</button></div></section></div>`}
function showPendingReview(){let d=$('#selected-date').value||today,active=state.members.filter(m=>m.status!=='Inactive'),rows=active.map(m=>{let plan=m.plan&&m.plan.length?m.plan:['Breakfast','Lunch','Dinner'],marked=mealsFor(d)[m.id]||[];return {m,pending:plan.filter(t=>!marked.includes(t))}}).filter(x=>x.pending.length);modal('Pending meal review',`<p class="muted">Unmarked meals for ${d}</p><div class="table-wrap"><table><thead><tr><th>Member</th><th>Pending meal slots</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.m.name)}</td><td>${x.pending.join(', ')}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No pending meal slots.</td></tr>'}</tbody></table></div>`,'Open attendance',()=>{closeModal();showPage('meals')})}

function downloadExcel(rows,name){let escXml=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'),xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Report"><Table>'+rows.map(row=>'<Row>'+row.map(v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${escXml(v)}</Data></Cell>`).join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>';download(xml,name.replace(/\.xlsx?$/i,'')+'.xls','application/vnd.ms-excel')}

function pdfEscape(x){return String(x??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function makePdf(pages){let objects=[];objects[1]='<< /Type /Catalog /Pages 2 0 R >>';objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';let kids=[];pages.forEach((lines,i)=>{let pageId=4+i*2,contentId=pageId+1;kids.push(`${pageId} 0 R`);let stream='BT /F1 11 Tf 50 790 Td 15 TL '+lines.map((line,j)=>`${j?'T* ':''}(${pdfEscape(line)}) Tj`).join(' ')+' ET';objects[pageId]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;objects[contentId]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`});objects[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let pdf='%PDF-1.4\n',offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`}let xref=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return pdf}

function parseCsv(text){let rows=[],row=[],value='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){value+='"';i++}else if(c==='"')quoted=false;else value+=c}else if(c==='"')quoted=true;else if(c===','){row.push(value);value=''}else if(c==='\n'){row.push(value.replace(/\r$/,''));rows.push(row);row=[];value=''}else value+=c}if(value.length||row.length){row.push(value.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(x=>x!==''))}
function importDataFile(e){let f=e.target.files?.[0];if(!f)return;if(/\.sqlite?$/i.test(f.name))return toast('Use the SQLite migration helper to convert this database to JSON, then restore the JSON here.');let reader=new FileReader();reader.onload=()=>{try{if(/\.json$/i.test(f.name)){let x=JSON.parse(reader.result);if(!x||!Array.isArray(x.members))throw Error('Not a Padmavati JSON backup');state={...state,...x};state.expenses||=[];state.payments||=[];state.meals||={};state.rates||={Breakfast:30,Lunch:60,Dinner:60};state.ui||={};ensureHistoryData();save();toast('Complete JSON backup restored.');return}let table=parseCsv(reader.result),head=table.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,'_')),idx=Object.fromEntries(head.map((x,i)=>[x,i])),get=(r,...names)=>{for(const n of names)if(idx[n]!==undefined)return r[idx[n]]||'';return ''};let n=0;for(const r of table){let name=get(r,'name','member_name','member'),date=get(r,'date','expense_date','meal_date','payment_date'),category=get(r,'category'),amount=Number(get(r,'amount','value'))||0;if(idx.expense_date!==undefined||idx.category!==undefined&&idx.description!==undefined){state.expenses.push({date:date||today,category:category||'Other',desc:get(r,'description','desc'),vendor:get(r,'vendor','shop'),amount,mode:get(r,'payment_mode','mode')||'Cash',notes:get(r,'notes','remarks')});n++;continue}if(idx.meal_type!==undefined){let m=state.members.find(x=>x.id===get(r,'member_id','id')||x.name.toLowerCase()===name.toLowerCase());if(m&&date){state.meals[date]||={};state.meals[date][m.id]||=[];let t=get(r,'meal_type');if(t&&!state.meals[date][m.id].includes(t))state.meals[date][m.id].push(t);n++}continue}if(idx.payment_date!==undefined||idx.payment_mode!==undefined&&idx.amount!==undefined){let m=state.members.find(x=>x.id===get(r,'member_id')||x.name.toLowerCase()===name.toLowerCase());if(m&&date){state.payments.push({id:Date.now()+'-'+n,member:m.id,date,amount,mode:get(r,'payment_mode','mode')||'Cash',note:get(r,'rema async function handleLocalLogin(event){event.preventDefault();let mode=localAuthMode;if(!authCryptoAvailable())return $('#auth-error').textContent='Secure password handling needs a recent version of Chrome or Edge.';try{if(mode==='login'){let username=$('#auth-user').value.trim(),password=$('#auth-password').value,record=readLocalAuth();if(!username||!password)return $('#auth-error').textContent='Enter your user ID and password.';if(!record)return showLocalAuth('setup');let hash=await authPasswordHash(password,record.salt);if(username.toLowerCase()!==String(record.username).toLowerCase()||!authHashMatches(hash,record.hash))return $('#auth-error').textContent='User ID or password is incorrect.';unlockLocalApp();return}if(mode==='setup'){let username=$('#auth-user').value.trim(),password=$('#auth-password').value,phone=normalizeAuthPhone($('#auth-mobile').value,$('#auth-country-code').value);if(!username)return $('#auth-error').textContent='Enter a user ID.';if(password.length<6)return $('#auth-error').textContent='Use a password with at least 6 characters.';if(password!==$('#auth-confirm').value)return $('#auth-error').textContent='The passwords do not match.';if(!phone)return $('#auth-error').textContent='Enter a valid country code (for example +91) and mobile number (for example 98765 43210).';$('#auth-error').textContent='Sending a verification code…';await authOtpRequest('/api/otp/start',{phone});pendingAuthAction={type:'setup',username,password,phone};showLocalAuth('setup-verify','A verification code was sent to '+maskAuthPhone(phone)+'.');return}if(mode==='setup-verify'||mode==='recover-verify'||mode==='mobile-verify'){let code=$('#auth-code').value.trim(),pending=pendingAuthAction;if(!pending||!code)return $('#auth-error').textContent='Enter the verification code.';let result=await authOtpRequest('/api/otp/check',{phone:pending.phone,code});if(!result.verified)return $('#auth-error').textContent='That code is not correct or has expired.';if(pending.type==='setup'){let salt=authRandomSalt(),hash=await authPasswordHash(pending.password,salt);storeLocalAuth({version:1,username:pending.username,salt,hash,mobile:pending.phone});pendingAuthAction=null;unlockLocalApp();toast('Login and recovery phone saved.');return}if(pending.type==='recover'){pendingAuthAction={...pending,verified:true};showLocalAuth('recover-set','Phone verified. You can set a new user ID and password.');return}if(pending.type==='mobile-update'){let record=readLocalAuth();if(!record)throw Error('Sign-in record not found.');record.mobile=pending.phone;storeLocalAuth(record);pendingAuthAction=null;unlockLocalApp();toast('Recovery phone verified and saved.');return}}if(mode==='recover-set'){let pending=pendingAuthAction,record=readLocalAuth(),username=$('#auth-user').value.trim(),password=$('#auth-password').value;if(!pending||pending.type!=='recover'||!pending.verified||!record)return showLocalAuth('login','Recovery session expired. Start again.');if(!username)return $('#auth-error').textContent='Enter a user ID.';if(password.length<6)return $('#auth-error').textContent='Use a password with at least 6 characters.';if(password!==$('#auth-confirm').value)return $('#auth-error').textContent='The passwords do not match.';let salt=authRandomSalt(),hash=await authPasswordHash(password,salt);storeLocalAuth({version:1,username,salt,hash,mobile:pending.phone});pendingAuthAction=null;unlockLocalApp();toast('Your sign-in was recovered.')}}catch(error){$('#auth-error').textContent=error.message||'Unable to complete sign-in. Check the OTP server and try again.'}}
function changeLocalLogin(){let record=readLocalAuth();if(!record)return toast('No sign-in is set up on this device.');modal('Change user ID and password',`<div class="form"><label>Current password<input id="auth-current-password" class="field" type="password" autocomplete="current-password"></label><label>New user ID<input id="auth-new-user" class="field" value="${esc(record.username)}" autocomplete="username"></label><label>New password<input id="auth-new-password" class="field" type="password" autocomplete="new-password"></label><label>Confirm new password<input id="auth-new-confirm" class="field" type="password" autocomplete="new-password"></label></div><p class="auth-note">Use at least 6 characters for the new password.</p>`,'Save sign-in',async()=>{let currentPassword=$('#auth-current-password').value,newUser=$('#auth-new-user').value.trim(),newPassword=$('#auth-new-password').value;if(!newUser)return toast('Enter a user ID.');if(!newPassword||newPassword.length<6)return toast('Use a password with at least 6 characters.');if(newPassword!==$('#auth-new-confirm').value)return toast('The new passwords do not match.');try{let currentHash=await authPasswordHash(currentPassword,record.salt);if(!authHashMatches(currentHash,record.hash))return toast('Current password is incorrect.');let salt=authRandomSalt(),hash=await authPasswordHash(newPassword,salt);storeLocalAuth({version:1,username:newUser,salt,hash,mobile:record.mobile||''});closeModal();toast('User ID and password updated.')}catch(error){toast('Could not update the sign-in in this browser.')}})}
function changeRecoveryMobile(){let record=readLocalAuth();if(!record)return toast('No sign-in is set up on this device.');modal('Add or change recovery mobile',`<div class="form"><label>Current password<input id="auth-phone-current-password" class="field" type="password" autocomplete="current-password"></label><div class="country-phone-row"><label>Country code<input id="auth-phone-country" class="field" type="tel" value="+91" placeholder="+91" inputmode="tel" autocomplete="tel-country-code"></label><label>Mobile number<input id="auth-phone-new" class="field" type="tel" placeholder="98765 43210" inputmode="tel" autocomplete="tel-national"></label></div></div><p class="auth-note">Enter the country code and mobile number separately. We will send a code to the new number, which is saved only after verification.</p>`,'Send verification code',async()=>{let password=$('#auth-phone-current-password').value,phone=normalizeAuthPhone($('#auth-phone-new').value,$('#auth-phone-country').value);if(!phone)return toast('Check the separate country code and mobile number fields. Example: +91 and 98765 43210.');if(phone===record.mobile)return toast('That number is already registered.');try{let hash=await authPasswordHash(password,record.salt);if(!authHashMatches(hash,record.hash))return toast('Current password is incorrect.');await authOtpRequest('/api/otp/start',{phone});pendingAuthAction={type:'mobile-update',phone};closeModal();showLocalAuth('mobile-verify','A verification code was sent to '+maskAuthPhone(phone)+'.')}catch(error){toast(error.message||'Could not send a verification code.')}})}
const settingsPageBeforeLogin=settingsPage;
settingsPage=function(){let record=readLocalAuth();return settingsPageBeforeLogin()+`<section class="card"><h2>Sign-in & recovery</h2><p class="muted">User ID: <strong>${esc(record?.username||'Not set')}</strong> · Recovery mobile: <strong>${esc(record?.mobile?maskAuthPhone(record.mobile):'Not registered')}</strong></p><div class="row"><button class="btn" onclick="changeLocalLogin()">Change user ID / password</button><button class="btn" onclick="changeRecoveryMobile()">${record?.mobile?'Change recovery mobile':'Add recovery mobile'}</button><button class="btn danger" onclick="lockLocalApp()">Lock now</button></div><p class="muted">Password changes require your current password. Recovery requires an SMS code sent to the registered phone.</p></section>`};
function lockLocalApp(){closeModal();pendingAuthAction=null;showLocalAuth('login','You are signed out. Enter your details to continue.')}
ensureMemberNumbers();
initializeLocalAuth();</script></body></html>
